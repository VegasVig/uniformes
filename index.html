<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação_De_Uniforme</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a1a1a, #000);
            color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 25px 0;
            box-sizing: border-box;
        }

        .container {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(200, 200, 200, 0.2);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(200, 200, 200, 0.2);
            animation: fadeIn 0.8s ease;
            position: relative;
            box-sizing: border-box;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.4), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        img.logo {
            width: 130px;
            display: block;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 10px rgba(200, 200, 200, 0.6));
        }

        h2,
        h3,
        h4 {
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h3 {
            color: #d1d5db;
            margin-top: 20px;
        }

        h4 {
            color: #d1d5db;
            margin-top: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #444;
            background: rgba(0, 0, 0, 0.6);
            color: #e5e5e5;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            transform: translateY(-2px);
            border: 1px solid #c0c0c0;
            box-shadow: 0 0 10px #c0c0c0;
        }

        .protocolo-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(192, 192, 192, 0.5);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .protocolo-label {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .protocolo-valor {
            font-size: 15px;
            font-weight: bold;
            color: #e5e5e5;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }

        .protocolo-icon {
            font-size: 22px;
            opacity: 0.7;
        }

        .upload-area {
            margin-top: 14px;
            border: 2px dashed rgba(192, 192, 192, 0.4);
            border-radius: 12px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
        }

        .upload-area:hover {
            border-color: #c0c0c0;
            background: rgba(192, 192, 192, 0.07);
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .upload-icon {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .upload-text {
            font-size: 13px;
            color: #9ca3af;
        }

        .upload-text strong {
            color: #d1d5db;
        }

        .fotos-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .foto-thumb {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
            flex-shrink: 0;
        }

        .foto-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .foto-thumb .remover {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0, 0, 0, 0.75);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }

        .foto-thumb .remover:hover {
            background: #dc2626;
        }

        .foto-contador {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
        }

        .item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #2a2a2a;
            padding: 12px;
            border-radius: 12px;
            margin: 8px 0;
            text-align: left;
            box-sizing: border-box;
        }

        .item label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .item input[type="checkbox"] {
            width: auto;
            margin: 0;
            accent-color: #c0c0c0;
        }

        .item select {
            margin-top: 8px;
        }

        canvas {
            width: 100%;
            height: 150px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(200, 200, 200, 0.4);
            touch-action: none;
            display: block;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #c0c0c0, #e5e5e5);
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px #c0c0c0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="assets/vegaslogo.jpg" class="logo">

        <h2>Solicitação de Uniforme</h2>

        <div class="protocolo-box">
            <div>
                <div class="protocolo-label">Protocolo</div>
                <div class="protocolo-valor" id="protocolo-display">---</div>
            </div>

            <div class="protocolo-icon">🔖</div>
        </div>

        <input id="nome" placeholder="Nome do funcionário">
        <input id="cpf" placeholder="CPF">
        <input id="telefone" placeholder="Telefone">

        <select id="cidade" onchange="carregarPostos()">
            <option value="">Selecione a Cidade</option>

            <option value="Queimados">Queimados</option>
            <option value="Três Rios">Três Rios</option>
            <option value="Volta Redonda">Volta Redonda</option>
            <option value="Barra Mansa">Barra Mansa</option>
            <option value="Nova Iguaçu">Nova Iguaçu</option>
            <option value="Resende">Resende</option>
            <option value="Barra do Piraí">Barra do Piraí</option>
            <option value="Sapucaia">Sapucaia</option>
            <option value="Miguel Pereira">Miguel Pereira</option>
            <option value="Valença">Valença</option>
            <option value="Pinheiral">Pinheiral</option>
            <option value="Porto Real">Porto Real</option>
            <option value="Piraí">Piraí</option>
        </select>

        <select id="posto" onchange="carregarUniformes()">
            <option value="">Selecione o Posto</option>
        </select>

        <div id="uniformes"></div>

        <h4>Observação</h4>

        <textarea id="observacao"></textarea>

        <h4>📷 Foto do Uniforme com Avaria</h4>

        <div class="upload-area">

            <input type="file" id="fotoAvaria" accept="image/*" multiple onchange="adicionarFotos(event)">

            <div class="upload-icon">📁</div>

            <div class="upload-text">
                <strong>Toque para selecionar</strong>
                <br>
                ou arraste as fotos aqui
                <br>
                <span style="font-size:11px;color:#6b7280;">
                    JPG, PNG, WEBP – máx. 3 fotos
                </span>
            </div>
        </div>

        <div class="fotos-preview" id="fotosPreview"></div>

        <div class="foto-contador" id="fotoContador"></div>

        <h3>Assinatura</h3>

        <canvas id="assinatura"></canvas>

        <button onclick="limpar()">Limpar Assinatura</button>

        <button id="btnEnviar" onclick="enviar()">
            ENVIAR SOLICITAÇÃO
        </button>

    </div>

    <script>

        /* =========================
           PROTOCOLO
        ========================== */

        function gerarProtocolo() {

            const now = new Date();

            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();

            const rand = Math.floor(1000 + Math.random() * 9000);

            return `VGS-${yyyy}${mm}${dd}-${rand}`;
        }

        const PROTOCOLO = gerarProtocolo();

        document.getElementById("protocolo-display").textContent = PROTOCOLO;


        /* =========================
           MÁSCARAS
        ========================== */

        document.getElementById("cpf").oninput = e => {

            let v = e.target.value
                .replace(/\D/g, '')
                .slice(0, 11);

            v = v
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d{1,2})$/, '$1-$2');

            e.target.value = v;
        };

        document.getElementById("telefone").oninput = e => {

            let v = e.target.value
                .replace(/\D/g, '')
                .slice(0, 11);

            v = v.length > 10
                ? v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3')
                : v.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');

            e.target.value = v;
        };


        /* =========================
           COMPRESSÃO IMAGEM
        ========================== */

        function comprimirImagem(arquivo, maxSize = 800, qualidade = 0.65) {

            return new Promise(resolve => {

                const reader = new FileReader();

                reader.onload = ev => {

                    const img = new Image();

                    img.onload = () => {

                        let w = img.width;
                        let h = img.height;

                        if (w > maxSize || h > maxSize) {

                            if (w > h) {

                                h = Math.round(h * maxSize / w);
                                w = maxSize;

                            } else {

                                w = Math.round(w * maxSize / h);
                                h = maxSize;
                            }
                        }

                        const c = document.createElement("canvas");

                        c.width = w;
                        c.height = h;

                        c.getContext("2d").drawImage(img, 0, 0, w, h);

                        resolve(c.toDataURL("image/jpeg", qualidade));
                    };

                    img.src = ev.target.result;
                };

                reader.readAsDataURL(arquivo);
            });
        }


        /* =========================
           FOTOS
        ========================== */

        let fotosBase64 = [];

        async function adicionarFotos(event) {

            const arquivos = Array.from(event.target.files);

            const max = 1;

            if (fotosBase64.length >= max) {

                alert("Máximo de 1 fotos.");
                event.target.value = "";

                return;
            }

            const restantes = max - fotosBase64.length;

            const paraProcessar = arquivos.slice(0, restantes);

            if (arquivos.length > restantes) {

                alert(`Só ${restantes} foto(s) adicionada(s). Limite de 1.`);
            }

            for (const arquivo of paraProcessar) {

                if (!arquivo.type.startsWith("image/")) continue;

                const b64 = await comprimirImagem(arquivo);

                fotosBase64.push({
                    base64: b64,
                    nome: arquivo.name
                });
            }

            renderizarPreviews();

            event.target.value = "";
        }

        function removerFoto(index) {

            fotosBase64.splice(index, 1);

            renderizarPreviews();
        }

        function renderizarPreviews() {

            const div = document.getElementById("fotosPreview");

            div.innerHTML = fotosBase64.map((foto, i) => `

                <div class="foto-thumb">

                    <img src="${foto.base64}">

                    <button class="remover"
                        type="button"
                        onclick="removerFoto(${i})">
                        ✕
                    </button>

                </div>

            `).join("");

            document.getElementById("fotoContador").textContent =
                fotosBase64.length > 0
                    ? `${fotosBase64.length} foto(s) selecionada(s)`
                    : "";
        }


        /* =========================
           POSTOS
        ========================== */

        const cidadesPostos = {

            "Volta Redonda": [
                "Nagumo",
                "Royal Vila Sta Cecilia",
                "Royal Retiro"
            ],

            "Resende": [
                "Tachi-S Brasil",
                "Brabus"
            ]
        };


        /* =========================
           UNIFORMES
        ========================== */

        const postosUniformes = {

            "Tachi-S Brasil": [

                "Camisa vigilante bege curta",
                "Camisa vigilante bege longa",
                "Calça vigilante tática",
                "Blusa preta vigilância",
                "Casaco vigilância",
                "Coturno"
            ],

            "Brabus": [

                "Camisa vigilante bege curta",
                "Camisa vigilante bege longa",
                "Calça vigilante tática",
                "Blusa preta vigilância",
                "Casaco vigilância",
                "Coturno"
            ],

            "Nagumo": [

                "Blazer",
                "Calça social",
                "Camisa social branca"
            ],

            "Royal Vila Sta Cecilia": [

                "Blazer",
                "Calça social",
                "Camisa social branca"
            ],

            "Royal Retiro": [

                "Blazer",
                "Calça social",
                "Camisa social branca"
            ]
        };


        function carregarPostos() {

            const cidade = document.getElementById("cidade").value;

            const sel = document.getElementById("posto");

            sel.innerHTML = `
                <option value="">
                    Selecione o Posto
                </option>
            `;

            document.getElementById("uniformes").innerHTML = "";

            (cidadesPostos[cidade] || []).forEach(p => {

                const o = document.createElement("option");

                o.value = p;
                o.textContent = p;

                sel.appendChild(o);
            });
        }


        function carregarUniformes() {

            const posto = document.getElementById("posto").value;

            const div = document.getElementById("uniformes");

            div.innerHTML = "";

            if (!postosUniformes[posto]) return;

            postosUniformes[posto].forEach(nome => {

                let tamanhos = null;

                /* =========================
                   CORREÇÃO CALÇA
                   AGORA ATÉ 60
                ========================== */

                if (/sapato|botina|coturno|galocha/i.test(nome)) {

                    tamanhos = Array.from(
                        { length: 27 },
                        (_, i) => i + 34
                    );

                } else if (/camisa social/i.test(nome)) {

                    tamanhos = [
                        "N2",
                        "N3",
                        "N4",
                        "N5",
                        "N6",
                        "N7",
                        "N8"
                    ];

                } else if (/calça elástico/i.test(nome)) {

                    tamanhos = [
                        "P",
                        "M",
                        "G",
                        "GG",
                        "XG",
                        "EXG",
                        "EXGG"
                    ];

                } else if (/calça/i.test(nome)) {

                    /* =========================
                       AQUI A CORREÇÃO
                       36 ATÉ 60
                    ========================== */

                    tamanhos = Array.from(
                        { length: 25 },
                        (_, i) => i + 36
                    );

                } else if (/camisa|blusa|casaco|blazer/i.test(nome)) {

                    tamanhos = [
                        "P",
                        "M",
                        "G",
                        "GG",
                        "XG",
                        "EXG"
                    ];
                }

                div.innerHTML += `

                    <div class="item">

                        <label>

                            <input type="checkbox">

                            ${nome}

                        </label>

                        ${tamanhos
                        ? `
                                <select>

                                    <option value="">
                                        Tamanho
                                    </option>

                                    ${tamanhos.map(t => `
                                        <option>${t}</option>
                                    `).join("")}

                                </select>
                            `
                        : ""
                    }

                    </div>
                `;
            });
        }


        /* =========================
           ASSINATURA
        ========================== */

        const canvas = document.getElementById("assinatura");

        const ctx = canvas.getContext("2d");

        canvas.width = 370;
        canvas.height = 150;

        let desenhando = false;

        canvas.addEventListener("mousedown", e => {

            desenhando = true;

            ctx.beginPath();

            ctx.moveTo(e.offsetX, e.offsetY);
        });

        canvas.addEventListener("mouseup", () => {

            desenhando = false;
        });

        canvas.addEventListener("mousemove", e => {

            if (!desenhando) return;

            ctx.lineWidth = 2;

            ctx.lineCap = "round";

            ctx.lineTo(e.offsetX, e.offsetY);

            ctx.stroke();
        });

        function limpar() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }


        /* =========================
           ENVIO
        ========================== */

        let enviando = false;

        async function enviar() {

            if (enviando) return;

            const btn = document.getElementById("btnEnviar");

            enviando = true;

            btn.disabled = true;

            btn.innerText = "ENVIANDO...";

            try {

                const nome = document.getElementById("nome").value.trim();

                const cpf = document.getElementById("cpf").value;

                const telefone = document.getElementById("telefone").value;

                const postoSel = document.getElementById("posto");

                const posto = postoSel.value;

                const obs = document.getElementById("observacao").value;

                if (
                    !nome ||
                    cpf.length < 14 ||
                    telefone.length < 14 ||
                    !posto
                ) {

                    alert("Preencha todos os dados.");

                    resetarBotao();

                    return;
                }

                let lista = [];

                document.querySelectorAll(".item").forEach(item => {

                    const check = item.querySelector("input");

                    const select = item.querySelector("select");

                    if (check.checked) {

                        const nomeUniforme =
                            item.querySelector("label").innerText.trim();

                        if (select) {

                            lista.push(
                                `${nomeUniforme} - ${select.value}`
                            );

                        } else {

                            lista.push(nomeUniforme);
                        }
                    }
                });

                if (lista.length === 0) {

                    alert("Selecione ao menos um uniforme.");

                    resetarBotao();

                    return;
                }

                const assinatura = canvas.toDataURL("image/png");

                const payload = {

                    func: "salvarUniforme",

                    protocolo: PROTOCOLO,

                    data: new Date().toLocaleString("pt-BR"),

                    nome,
                    cpf,
                    telefone,
                    posto,

                    uniformes: lista.join(", "),

                    observacao: obs,

                    assinatura,

                    fotos: fotosBase64.map(f => f.base64)
                };

                await fetch(
                    "https://script.google.com/macros/s/AKfycbxeFZGXM28fUn8_2wA_hAAQ9v_N62Rm-RksUlGFbs4ofpYlwKOuA_d_J2awDDDnTZ6f0Q/exec",
                    {
                        method: "POST",
                        mode: "no-cors",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    }
                );

                /* =========================
                   PDF
                ========================== */

                const { jsPDF } = window.jspdf;

                const pdf = new jsPDF();

                pdf.setFontSize(16);

                pdf.text(
                    "COMPROVANTE DE SOLICITAÇÃO",
                    20,
                    20
                );

                pdf.setFontSize(12);

                pdf.text(`Funcionário: ${nome}`, 20, 40);

                pdf.text(`CPF: ${cpf}`, 20, 50);

                pdf.text(`Telefone: ${telefone}`, 20, 60);

                pdf.text(`Posto: ${posto}`, 20, 70);

                pdf.text(`Protocolo: ${PROTOCOLO}`, 20, 80);

                let y = 95;

                pdf.text("Uniformes:", 20, y);

                y += 10;

                lista.forEach(item => {

                    pdf.text(`- ${item}`, 20, y);

                    y += 8;
                });

                if (obs) {

                    y += 5;

                    pdf.text(`Observação: ${obs}`, 20, y);

                    y += 10;
                }

                if (fotosBase64.length > 0) {

                    pdf.text("Fotos:", 20, y);

                    y += 10;

                    for (const foto of fotosBase64) {

                        pdf.addImage(
                            foto.base64,
                            "JPEG",
                            20,
                            y,
                            60,
                            45
                        );

                        y += 55;
                    }
                }

                pdf.text("Assinatura:", 20, y);

                pdf.addImage(
                    assinatura,
                    "PNG",
                    20,
                    y + 5,
                    80,
                    35
                );

                pdf.save(
                    `comprovante_uniforme_${PROTOCOLO}.pdf`
                );

                btn.innerText = "ENVIADO ✓";

                btn.style.background = "#16a34a";

                alert(
                    `Solicitação enviada!\nProtocolo: ${PROTOCOLO}`
                );

            } catch (err) {

                console.error(err);

                alert("Erro ao enviar.");

                resetarBotao();
            }
        }


        function resetarBotao() {

            const btn =
                document.getElementById("btnEnviar");

            enviando = false;

            btn.disabled = false;

            btn.innerText = "ENVIAR SOLICITAÇÃO";

            btn.style.background =
                "linear-gradient(90deg, #c0c0c0, #e5e5e5)";
        }

    </script>

</body>

</html>
