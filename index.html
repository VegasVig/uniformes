        body {

            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 25px 0;
            box-sizing: border-box;
        }

        .container {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(200, 200, 200, 0.2);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(200, 200, 200, 0.2);
            animation: fadeIn 0.8s ease;
            position: relative;
            box-sizing: border-box;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.4), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

            pointer-events: none;

        img.logo {

        }

            margin-top: 15px;
        }

        select,
        textarea {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #444;
            background: rgba(0, 0, 0, 0.6);
            color: #e5e5e5;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        input:focus,

        /* ======= PROTOCOLO ======= */
        function gerarProtocolo() {
            const now = new Date();
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            const rand = Math.floor(1000 + Math.random() * 9000);
            return `VGS-${yyyy}${mm}${dd}-${rand}`;
        }

        const PROTOCOLO = gerarProtocolo();
        document.getElementById("protocolo-display").textContent = PROTOCOLO;

        /* ======= MÁSCARAS ======= */
        document.getElementById("cpf").oninput = e => {
            let v = e.target.value.replace(/\D/g, '').slice(0, 11);
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v;
        };

        document.getElementById("telefone").oninput = e => {
            let v = e.target.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 10)
                v = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
            else
                v = v.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');
            e.target.value = v;
        };

        /* ======= FOTO DE AVARIA ======= */
let fotosBase64 = [];

function adicionarFotos(event) {
    const arquivo = event.target.files[0];

    if (!arquivo) return;

    if (!arquivo.type.startsWith("image/")) {
        alert("Selecione apenas imagens.");
        return;
    }

    const reader = new FileReader();

    reader.onload = e => {
        fotosBase64 = [{
            base64: e.target.result,
            nome: arquivo.name
        }];

        renderizarPreviews();
    };

    reader.readAsDataURL(arquivo);

    event.target.value = "";
}

function removerFoto(index) {
    fotosBase64.splice(index, 1);
    renderizarPreviews();
}

function renderizarPreviews() {

    const contador = document.getElementById("fotoContador");

        div.innerHTML += `
        <div class="foto-thumb">
            <img src="${foto.base64}" alt="Foto">
            <button class="remover" onclick="removerFoto(${i})">✕</button>
        </div>`;
    });

    contador.textContent =
        fotosBase64.length > 0
            ? "1 foto selecionada"
            : "";
}

        function carregarPostos() {
            const cidade = document.getElementById("cidade").value;
            const selectPosto = document.getElementById("posto");
            selectPosto.innerHTML = '<option value="">Selecione o Posto</option>';
            document.getElementById("uniformes").innerHTML = "";
            if (cidadesPostos[cidade]) {
                cidadesPostos[cidade].forEach(posto => {
                    const opt = document.createElement("option");
                    opt.value = posto;
                    opt.textContent = posto;
                    selectPosto.appendChild(opt);
                });
            }
        }

        function carregarUniformes() {
            const posto = document.getElementById("posto").value;
            const div = document.getElementById("uniformes");
            div.innerHTML = "";
            if (!postosUniformes[posto]) return;

            postosUniformes[posto].forEach(nome => {
                let tamanhos = null;
                if (/sapato|botina|coturno|galocha/i.test(nome))
                    tamanhos = Array.from({ length: 15 }, (_, i) => i + 34);
                else if (/camisa social/i.test(nome))
                    tamanhos = ["N2", "N3", "N4", "N5", "N6", "N7", "N8"];
                else if (/calça elástico/i.test(nome))
                    tamanhos = ["P", "M", "G", "GG", "XG", "EXG", "EXGG"];
                else if (/calça/i.test(nome))
                    tamanhos = Array.from({ length: 25 }, (_, i) => i + 36);
                else if (/camisa|blusa|casaco|blazer/i.test(nome))
                    tamanhos = ["P", "M", "G", "GG", "EG"];

                div.innerHTML += `
        <div class="item">
            <label><input type="checkbox"> ${nome}</label>
            ${tamanhos ? `
            <select>
                <option>Tamanho</option>
                ${tamanhos.map(t => `<option>${t}</option>`).join("")}
            </select>` : ""}
        </div>`;
            });
        }

        /* ======= ASSINATURA ======= */
        const canvas = document.getElementById("assinatura");
        const ctx = canvas.getContext("2d");
        canvas.width = 370;
        canvas.height = 150;

        let desenhando = false;
        canvas.addEventListener("mousedown", e => { desenhando = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
        canvas.addEventListener("mouseup", () => desenhando = false);
        canvas.addEventListener("mousemove", e => {
            if (!desenhando) return;
            ctx.lineWidth = 2; ctx.lineCap = "round";
            ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();
        });
        canvas.addEventListener("touchstart", e => {
            e.preventDefault();
            const r = canvas.getBoundingClientRect(); const t = e.touches[0];
            desenhando = true; ctx.beginPath(); ctx.moveTo(t.clientX - r.left, t.clientY - r.top);
        });
        canvas.addEventListener("touchend", () => desenhando = false);
        canvas.addEventListener("touchmove", e => {
            e.preventDefault();
            if (!desenhando) return;
            const r = canvas.getBoundingClientRect(); const t = e.touches[0];
            ctx.lineWidth = 2; ctx.lineCap = "round";
            ctx.lineTo(t.clientX - r.left, t.clientY - r.top); ctx.stroke();
        });

        function limpar() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        /* ======= ENVIO ======= */
        let enviando = false;

        async function enviar() {
            if (enviando) return;
            const btn = document.getElementById("btnEnviar");
            enviando = true;
            btn.disabled = true;
            btn.innerText = "ENVIANDO...";
            btn.style.opacity = "0.6";

            try {
                const nome = document.getElementById("nome").value.trim();
                const cpf = document.getElementById("cpf").value;
                const telefone = document.getElementById("telefone").value;
                const postoSel = document.getElementById("posto");
                const posto = postoSel.options[postoSel.selectedIndex].text;
                const obs = document.getElementById("observacao").value;

                if (!nome || cpf.length < 14 || telefone.length < 14 || !postoSel.value) {
                    alert("Preencha todos os dados.");
                    resetarBotao(); return;
                }

                let lista = [];
                document.querySelectorAll(".item").forEach(item => {
                    const check = item.querySelector("input");
                    const select = item.querySelector("select");
                    if (check.checked) {
                        lista.push(select
                            ? check.parentNode.innerText.trim() + " - " + select.value
                            : check.parentNode.innerText.trim());
                    }
                });

                if (lista.length === 0) {
                    alert("Selecione ao menos um uniforme.");
                    resetarBotao(); return;
                }

                const assinatura = canvas.toDataURL("image/png");

                // Monta payload — fotos como array de base64
                const payload = {
                    func: "salvarUniforme",
                    protocolo: PROTOCOLO,
                    data: new Date().toLocaleString("pt-BR"),
                    nome,
                    cpf,
                    telefone,
                    posto,
                    uniformes: lista.join(", "),
                    observacao: obs,
                    assinatura,
                    fotos: fotosBase64.map(f => f.base64)   // array de base64 strings
                };

                await fetch("https://script.google.com/macros/s/AKfycbxQ6H-X_ZZSr_41cTRLWb_c1hgVySZnLKG1TITAG87FHH4PLhSHy7irOJkBmNika-7Q/exec",
                    { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }
                );

                /* ===== GERA PDF COM PROTOCOLO E FOTOS ===== */
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();

                // Cabeçalho
                pdf.setFontSize(16);
                pdf.text("COMPROVANTE DE SOLICITAÇÃO", 20, 20);

                // Protocolo destacado
                pdf.setFillColor(30, 30, 30);
                pdf.roundedRect(15, 26, 180, 14, 4, 4, 'F');
                pdf.setTextColor(220, 220, 220);
                pdf.setFontSize(11);
                pdf.text("Protocolo: " + PROTOCOLO, 20, 35);
                pdf.setTextColor(0, 0, 0);

                pdf.setFontSize(12);
                pdf.text("Funcionário: " + nome, 20, 52);
                pdf.text("CPF: " + cpf, 20, 62);
                pdf.text("Telefone: " + telefone, 20, 72);
                pdf.text("Posto: " + posto, 20, 82);

                let y = 95;
                pdf.text("Uniformes solicitados:", 20, y); y += 10;
                lista.forEach(u => {
                    const linhas = pdf.splitTextToSize("- " + u, 170);
                    linhas.forEach(l => {
                        pdf.text(l, 20, y); y += 7;
                        if (y > 265) { pdf.addPage(); y = 20; }
                    });
                });

                if (obs) {
                    y += 5;
                    pdf.text("Observação: " + obs, 20, y); y += 10;
                }

                // Fotos de avaria no PDF
                if (fotosBase64.length > 0) {
                    if (y > 200) { pdf.addPage(); y = 20; }
                    pdf.text("Fotos de avaria:", 20, y); y += 8;
                    for (const foto of fotosBase64) {
                        if (y > 220) { pdf.addPage(); y = 20; }
                        try {
                            pdf.addImage(foto.base64, "JPEG", 20, y, 80, 60);
                        } catch {
                            pdf.addImage(foto.base64, "PNG", 20, y, 80, 60);
                        }
                    }
                }

                // Assinatura
                if (y > 220) { pdf.addPage(); y = 20; }
                pdf.text("Assinatura:", 20, y + 10);
                pdf.addImage(assinatura, "PNG", 20, y + 15, 80, 40);
                pdf.text("Data: " + new Date().toLocaleString("pt-BR"), 20, y + 60);

                pdf.save("comprovante_uniforme_" + PROTOCOLO + ".pdf");

                btn.innerText = "ENVIADO ✓";
                btn.style.background = "#16a34a";
                btn.style.opacity = "1";
                alert("Solicitação enviada!\nProtocolo: " + PROTOCOLO);

            } catch (err) {
                console.error(err);
                alert("Erro ao enviar. Tente novamente.");
                resetarBotao();
            }
        }

        function resetarBotao() {
            const btn = document.getElementById("btnEnviar");
            enviando = false;
            btn.disabled = false;
            btn.innerText = "ENVIAR SOLICITAÇÃO";
            btn.style.opacity = "1";
            btn.style.cursor = "pointer";
            btn.style.background = "linear-gradient(90deg, #c0c0c0, #e5e5e5)";
        }

    </script>
</body>

</html>
