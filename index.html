        h4 { color: #d1d5db; margin-top: 15px; }

        textarea { height: 90px; resize: none; }
        input:focus, select:focus, textarea:focus { transform: translateY(-2px); border: 1px solid #c0c0c0; box-shadow: 0 0 10px #c0c0c0; }
        .protocolo-box { background: rgba(0,0,0,0.5); border: 1px solid rgba(192,192,192,0.5); border-radius: 12px; padding: 12px 16px; margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .protocolo-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }
        .protocolo-valor { font-size: 15px; font-weight: bold; color: #e5e5e5; letter-spacing: 2px; font-family: 'Courier New', monospace; }
        .protocolo-icon { font-size: 22px; opacity: 0.7; }
        .item { background: rgba(0,0,0,0.4); border: 1px solid #2a2a2a; padding: 12px; border-radius: 12px; margin: 8px 0; text-align: left; box-sizing: border-box; }
        .item label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .item input[type="checkbox"] { width: auto; margin: 0; accent-color: #c0c0c0; }
        .item select { margin-top: 8px; }
        canvas { width: 100%; height: 150px; background: rgba(255,255,255,0.95); border-radius: 12px; margin-top: 10px; box-shadow: 0 0 10px rgba(200,200,200,0.4); touch-action: none; display: block; box-sizing: border-box; }
        button { width: 100%; margin-top: 15px; padding: 12px; border-radius: 12px; border: none; background: linear-gradient(90deg, #c0c0c0, #e5e5e5); color: black; font-weight: bold; cursor: pointer; position: relative; overflow: hidden; box-sizing: border-box; transition: 0.3s; }

<script>
    /* ── PROTOCOLO ── */
    function gerarProtocolo() {
        const now = new Date();
        const dd   = String(now.getDate()).padStart(2,'0');
        const mm   = String(now.getMonth()+1).padStart(2,'0');
        const yyyy = now.getFullYear();
        const rand = Math.floor(1000 + Math.random()*9000);
        return `VGS-${yyyy}${mm}${dd}-${rand}`;
    }
    const PROTOCOLO = gerarProtocolo();
    document.getElementById("protocolo-display").textContent = PROTOCOLO;

    /* ── PREVIEW DA FOTO ── */
    document.getElementById("fotoArquivo").addEventListener("change", function () {
        const file = this.files[0];
        const preview = document.getElementById("previewFoto");
        if (file) { preview.src = URL.createObjectURL(file); preview.style.display = "block"; }
        else       { preview.style.display = "none"; }
    });

    /* ── MÁSCARAS ── */
    document.getElementById("cpf").oninput = e => {
        let v = e.target.value.replace(/\D/g,'').slice(0,11);
        v = v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
        e.target.value = v;
    };
    document.getElementById("telefone").oninput = e => {
        let v = e.target.value.replace(/\D/g,'').slice(0,11);
        v = v.length > 10 ? v.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3') : v.replace(/(\d{2})(\d{4})(\d{4})/,'($1) $2-$3');
        e.target.value = v;
    };

    /* ── COMPRESSÃO (igual ao formulário de materiais) ── */
    function comprimirImagem(arquivo) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement("canvas");
                    const maxSize = 800;
                    let w = img.width, h = img.height;
                    if (w > maxSize || h > maxSize) {
                        if (w > h) { h = (h * maxSize) / w; w = maxSize; }
                        else       { w = (w * maxSize) / h; h = maxSize; }
                    }
                    c.width = w; c.height = h;
                    c.getContext("2d").drawImage(img, 0, 0, w, h);
                    resolve(c.toDataURL("image/jpeg", 0.6));
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(arquivo);
        });
    }

    function carregarPostos() {
        const cidade = document.getElementById("cidade").value;
        const sel = document.getElementById("posto");
        sel.innerHTML = '<option value="">Selecione o Posto</option>';
        document.getElementById("uniformes").innerHTML = "";
        (cidadesPostos[cidade]||[]).forEach(p => { const o=document.createElement("option"); o.value=p; o.textContent=p; sel.appendChild(o); });
    }

    function carregarUniformes() {
        const posto = document.getElementById("posto").value;
        const div = document.getElementById("uniformes");
        div.innerHTML = "";
        if (!postosUniformes[posto]) return;
        postosUniformes[posto].forEach(nome => {
            let tamanhos = null;
            if (/sapato|botina|coturno|galocha/i.test(nome))  tamanhos = Array.from({length:15},(_,i)=>i+34);
            else if (/camisa social/i.test(nome))              tamanhos = ["N2","N3","N4","N5","N6","N7","N8"];
            else if (/calça elástico/i.test(nome))             tamanhos = ["P","M","G","GG","XG","EXG","EXGG"];
            else if (/calça/i.test(nome))                      tamanhos = Array.from({length:25},(_,i)=>i+36);
            else if (/camisa|blusa|casaco|blazer/i.test(nome)) tamanhos = ["P","M","G","GG","EG"];
            div.innerHTML += `<div class="item"><label><input type="checkbox"> ${nome}</label>${tamanhos?`<select><option>Tamanho</option>${tamanhos.map(t=>`<option>${t}</option>`).join("")}</select>`:""}</div>`;
        });
    }

    /* ── ASSINATURA ── */
    const canvas = document.getElementById("assinatura");
    const ctx = canvas.getContext("2d");
    canvas.width = 370; canvas.height = 150;
    let desenhando = false;
    canvas.addEventListener("mousedown", e => { desenhando=true; ctx.beginPath(); ctx.moveTo(e.offsetX,e.offsetY); });
    canvas.addEventListener("mouseup", () => desenhando=false);
    canvas.addEventListener("mousemove", e => { if (!desenhando) return; ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineTo(e.offsetX,e.offsetY); ctx.stroke(); });
    canvas.addEventListener("touchstart", e => { e.preventDefault(); const r=canvas.getBoundingClientRect(),t=e.touches[0]; desenhando=true; ctx.beginPath(); ctx.moveTo(t.clientX-r.left,t.clientY-r.top); });
    canvas.addEventListener("touchend", () => desenhando=false);
    canvas.addEventListener("touchmove", e => { e.preventDefault(); if (!desenhando) return; const r=canvas.getBoundingClientRect(),t=e.touches[0]; ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineTo(t.clientX-r.left,t.clientY-r.top); ctx.stroke(); });
    function limpar() { ctx.clearRect(0,0,canvas.width,canvas.height); }

    /* ── ENVIO ── */
    let enviando = false;
    async function enviar() {
        if (enviando) return;
        const btn = document.getElementById("btnEnviar");
        enviando=true; btn.disabled=true; btn.innerText="ENVIANDO..."; btn.style.opacity="0.6";

        try {
            const nome     = document.getElementById("nome").value.trim();
            const cpf      = document.getElementById("cpf").value;
            const telefone = document.getElementById("telefone").value;
            const postoSel = document.getElementById("posto");
            const posto    = postoSel.options[postoSel.selectedIndex].text;
            const obs      = document.getElementById("observacao").value;
            const fotoInput= document.getElementById("fotoArquivo").files[0];

            if (!nome || cpf.length < 14 || telefone.length < 14 || !postoSel.value) {
                alert("Preencha todos os dados."); resetarBotao(); return;
            }

            let lista = [];
            document.querySelectorAll(".item").forEach(item => {
                const check = item.querySelector("input");
                const select = item.querySelector("select");
                if (check.checked) lista.push(select ? check.parentNode.innerText.trim()+" - "+select.value : check.parentNode.innerText.trim());
            });
            if (lista.length === 0) { alert("Selecione ao menos um uniforme."); resetarBotao(); return; }

            const assinatura = canvas.toDataURL("image/png");

            /* Comprime a foto antes de enviar (igual ao formulário de materiais) */
            let fotoBase64 = "";
            if (fotoInput) {
                fotoBase64 = await comprimirImagem(fotoInput);
            }

            const payload = {
                func:      "salvarUniforme",
                protocolo: PROTOCOLO,
                data:      new Date().toLocaleString("pt-BR"),
                nome, cpf, telefone, posto,
                uniformes:  lista.join(", "),
                observacao: obs,
                assinatura,
                // Envia como array com 1 item (compatível com o Apps Script existente)
                fotos: fotoBase64 ? [fotoBase64] : []
            };

            await fetch("https://script.google.com/macros/s/AKfycby09bSqj7qAKG4bEOc996--c4UllFA-yoPKvCK7pg2kMWYRr5OLLPbu4O-u-7s4Q_6H6Q/exec",
                { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });

            /* PDF */
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            pdf.setFontSize(16); pdf.text("COMPROVANTE DE SOLICITAÇÃO", 20, 20);
            pdf.setFillColor(30,30,30); pdf.roundedRect(15,26,180,14,4,4,'F');
            pdf.setTextColor(220,220,220); pdf.setFontSize(11); pdf.text("Protocolo: "+PROTOCOLO, 20, 35);
            pdf.setTextColor(0,0,0); pdf.setFontSize(12);
            pdf.text("Funcionário: "+nome, 20, 52);
            pdf.text("CPF: "+cpf, 20, 62);
            pdf.text("Telefone: "+telefone, 20, 72);
            pdf.text("Posto: "+posto, 20, 82);
            let y = 95;
            pdf.text("Uniformes solicitados:", 20, y); y+=10;
            lista.forEach(u => { pdf.splitTextToSize("- "+u,170).forEach(l => { pdf.text(l,20,y); y+=7; if(y>265){pdf.addPage();y=20;} }); });
            if (obs) { y+=5; pdf.text("Observação: "+obs, 20, y); y+=10; }
            if (fotoBase64) {
                if (y>200) { pdf.addPage(); y=20; }
                pdf.text("Foto de avaria:", 20, y); y+=8;
                try { pdf.addImage(fotoBase64,"JPEG",20,y,80,60); } catch { pdf.addImage(fotoBase64,"PNG",20,y,80,60); }
                y+=65;
            }
            if (y>220) { pdf.addPage(); y=20; }
            pdf.text("Assinatura:", 20, y+10);
            pdf.addImage(assinatura,"PNG",20,y+15,80,40);
            pdf.text("Data: "+new Date().toLocaleString("pt-BR"), 20, y+60);
            pdf.save("comprovante_uniforme_"+PROTOCOLO+".pdf");

            btn.innerText="ENVIADO ✓"; btn.style.background="#16a34a"; btn.style.opacity="1";
            alert("Solicitação enviada!\nProtocolo: "+PROTOCOLO);

        } catch(err) {
            console.error(err); alert("Erro ao enviar. Tente novamente."); resetarBotao();
        }
    }

    function resetarBotao() {
        const btn = document.getElementById("btnEnviar");
        enviando=false; btn.disabled=false; btn.innerText="ENVIAR SOLICITAÇÃO";
        btn.style.opacity="1"; btn.style.cursor="pointer";
        btn.style.background="linear-gradient(90deg, #c0c0c0, #e5e5e5)";
    }
</script>
</body>
