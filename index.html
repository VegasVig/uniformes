<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Uniforme</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a1a1a, #000);
            color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 25px 0;
            box-sizing: border-box;
        }

        /* CARD COM GLASSMORPHISM */
        .container {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(200, 200, 200, 0.2);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(200, 200, 200, 0.2);
            animation: fadeIn 0.8s ease;
            position: relative;
            box-sizing: border-box;
        }

        /* BORDA BRILHO */
        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(120deg, rgba(255,255,255,0.4), transparent);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        img.logo {
            width: 130px;
            display: block;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 10px rgba(200,200,200,0.6));
        }

        h2, h3, h4 {
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h3 { color: #d1d5db; margin-top: 20px; }
        h4 { color: #d1d5db; margin-top: 15px; }

        /* TODOS OS CAMPOS IGUAIS */
        input,
        select,
        textarea {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #444;
            background: rgba(0, 0, 0, 0.6);
            color: #e5e5e5;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            transform: translateY(-2px);
            border: 1px solid #c0c0c0;
            box-shadow: 0 0 10px #c0c0c0;
        }

        /* ITENS DE UNIFORME */
        .item {
            background: rgba(0,0,0,0.4);
            border: 1px solid #2a2a2a;
            padding: 12px;
            border-radius: 12px;
            margin: 8px 0;
            text-align: left;
            box-sizing: border-box;
        }

        .item label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .item input[type="checkbox"] {
            width: auto;
            margin: 0;
            accent-color: #c0c0c0;
        }

        .item select {
            margin-top: 8px;
        }

        /* CANVAS */
        canvas {
            width: 100%;
            height: 150px;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(200,200,200,0.4);
            touch-action: none;
            display: block;
            box-sizing: border-box;
        }

        /* BOTÃO BRILHO PRATA */
        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #c0c0c0, #e5e5e5);
            color: black;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            transition: 0.3s;
        }

        button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.8), transparent);
            transition: 0.5s;
        }

        button:hover::before { left: 100%; }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px #c0c0c0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

document.getElementById("cpf").oninput = e => {
    let v = e.target.value.replace(/\D/g,'').slice(0,11);
    v = v.replace(/(\d{3})(\d)/,'$1.$2');
    v = v.replace(/(\d{3})(\d)/,'$1.$2');
    v = v.replace(/(\d{3})(\d{1,2})$/,'$1-$2');
    e.target.value = v;
};

document.getElementById("telefone").oninput = e => {
    let v = e.target.value.replace(/\D/g,'').slice(0,11);
    if(v.length > 10)
        v = v.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');
    else

function carregarPostos() {
    const cidade = document.getElementById("cidade").value;
    const selectPosto = document.getElementById("posto");
    selectPosto.innerHTML = '<option value="">Selecione o Posto</option>';
    document.getElementById("uniformes").innerHTML = "";

    if (cidadesPostos[cidade]) {
        cidadesPostos[cidade].forEach(posto => {
            const opt = document.createElement("option");
            opt.value = posto;
            opt.textContent = posto;
            selectPosto.appendChild(opt);
        });
    }
}

function carregarUniformes() {
    const posto = document.getElementById("posto").value;
    const div = document.getElementById("uniformes");
    div.innerHTML = "";

    if (!postosUniformes[posto]) return;

    postosUniformes[posto].forEach(nome => {
        let tamanhos = null;

        if (/sapato|botina|coturno|galocha/i.test(nome))
            tamanhos = Array.from({length:15},(_,i)=>i+34);
        else if (/camisa social/i.test(nome))
            tamanhos = ["N2","N3","N4","N5","N6","N7","N8"];
        else if (/calça elástico/i.test(nome))
            tamanhos = ["P","M","G","GG","XG","EXG","EXGG"];
        else if (/calça/i.test(nome))
            tamanhos = Array.from({length:10},(_,i)=>i+38);
        else if (/camisa|blusa|casaco|blazer/i.test(nome))
            tamanhos = ["P","M","G","GG","EG"];

        div.innerHTML += `
        <div class="item">
            <label><input type="checkbox"> ${nome}</label>
            ${tamanhos ? `
            <select>
                <option>Tamanho</option>
                ${tamanhos.map(t=>`<option>${t}</option>`).join("")}
            </select>` : ""}
        </div>`;
    });
}

/* ======= ASSINATURA ======= */
const canvas = document.getElementById("assinatura");
const ctx = canvas.getContext("2d");
canvas.width = 370;
canvas.height = 150;

let desenhando = false;

canvas.addEventListener("mousedown", e => {
    desenhando = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});
canvas.addEventListener("mouseup", () => desenhando = false);
canvas.addEventListener("mousemove", e => {
    if (!desenhando) return;
    ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
});
canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    desenhando = true;
    ctx.beginPath();
    ctx.moveTo(t.clientX - r.left, t.clientY - r.top);
});
canvas.addEventListener("touchend", () => desenhando = false);
canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!desenhando) return;
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.lineTo(t.clientX - r.left, t.clientY - r.top);
    ctx.stroke();
});

function limpar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* ======= ENVIO ======= */
let enviando = false;

async function enviar() {
    if (enviando) return;
    const btn = document.getElementById("btnEnviar");
    enviando = true;
    btn.disabled = true;
    btn.innerText = "ENVIANDO...";
    btn.style.opacity = "0.6";

    try {
        const nome      = document.getElementById("nome").value;
        const cpf       = document.getElementById("cpf").value;
        const telefone  = document.getElementById("telefone").value;
        const postoSel  = document.getElementById("posto");
        const posto     = postoSel.options[postoSel.selectedIndex].text;
        const obs       = document.getElementById("observacao").value;

        if (!nome || cpf.length < 14 || telefone.length < 14 || !postoSel.value) {
            alert("Preencha todos os dados.");
            resetarBotao(); return;
        }

        let lista = [];
        document.querySelectorAll(".item").forEach(item => {
            const check  = item.querySelector("input");
            const select = item.querySelector("select");
            if (check.checked) {
                lista.push(select
                    ? check.parentNode.innerText.trim() + " - " + select.value
                    : check.parentNode.innerText.trim());
            }
        });

        if (lista.length === 0) {
            alert("Selecione ao menos um uniforme.");
            resetarBotao(); return;
        }

        const assinatura = canvas.toDataURL("image/png");

        await fetch("https://https://script.google.com/macros/s/AKfycbzShsqxbC--wyUm41iunQ_nrIbEynfPW9pp8qVmie42_hZ-i27chbUGJX1QXkTbQQGW/exec", {
            method: "POST",
            body: JSON.stringify({
                data: new Date().toLocaleString("pt-BR"),
                nome, cpf, telefone, posto,
                uniformes: lista.join(", "),
                observacao: obs,
                assinatura
            })
        });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        pdf.setFontSize(16);
        pdf.text("COMPROVANTE DE SOLICITAÇÃO", 20, 20);
        pdf.setFontSize(12);
        pdf.text("Funcionário: " + nome, 20, 40);
        pdf.text("CPF: " + cpf, 20, 50);
        pdf.text("Telefone: " + telefone, 20, 60);
        pdf.text("Posto: " + posto, 20, 70);
        let y = 85;
        pdf.text("Uniformes solicitados:", 20, y); y += 10;
        lista.forEach(u => {
            const linhas = pdf.splitTextToSize("- " + u, 170);
            linhas.forEach(l => {
                pdf.text(l, 20, y); y += 7;
                if (y > 270) { pdf.addPage(); y = 20; }
            });
        });
        pdf.text("Observação: " + (obs || "Nenhuma"), 20, y + 10);
        pdf.text("Assinatura:", 20, y + 25);
        pdf.addImage(assinatura, "PNG", 20, y + 30, 80, 40);
        pdf.text("Data: " + new Date().toLocaleString("pt-BR"), 20, y + 75);
        pdf.save("comprovante_uniforme.pdf");

        btn.innerText = "ENVIADO ✓";
        btn.style.background = "#16a34a";
        btn.style.opacity = "1";
        alert("Solicitação enviada com sucesso!");

    } catch(err) {
        alert("Erro ao enviar. Tente novamente.");
        resetarBotao();
    }
}

function resetarBotao() {
    const btn = document.getElementById("btnEnviar");
    enviando = false;
    btn.disabled = false;
    btn.innerText = "ENVIAR SOLICITAÇÃO";
    btn.style.opacity = "1";
    btn.style.cursor = "pointer";
    btn.style.background = "linear-gradient(90deg, #c0c0c0, #e5e5e5)";
}
